# Guidance Runtime update configuration.
#
# Two forms are accepted. The flat form below describes a single product and is
# read exactly as it always was: it becomes one target named "guidance-runtime",
# and its output wording is unchanged. It also stays flat when a channel is
# changed; the updater never rewrites an operator's file into the array form.
# Use the [[targets]] form to maintain more than one product with the same
# updater. Do not mix the two forms in one file; unknown keys are rejected in
# both forms.
#
# Parameters, flat form (single product, target name "guidance-runtime"):
#   repository     owner/repository holding the releases (required).
#   channel        "stable" (default) or "beta", case-insensitive; anything
#                  else is rejected. "stable" offers published releases only,
#                  "beta" additionally offers prereleases tagged v<semver>
#                  -beta.N (never alpha/rc, never drafts). See README.md,
#                  section "Channels".
#   install_dir    installation directory. Optional in this form; defaults to
#                  "C:\Program Files\Guidance Runtime".
#   service_name   optional. Omitted for "guidance-runtime" it still means the
#                  service "GuidanceRuntime"; any other product without it is
#                  installed without service control.
#   asset_pattern  optional asset suffix; must not be blank and must end in
#                  ".zip". Omit to derive it from the running platform and
#                  architecture (see the note at the bottom of this file).
#
# Parameters, [[targets]] form (one block per product):
#   name             stable identifier, unique in this file (required).
#   repository       owner/repository (required).
#   visibility       "public" (default; no credential is consulted) or
#                    "private" (requires credential_entry).
#   credential_entry NAME of the credential-store entry, required when private
#                    and never the secret itself. Windows Credential Manager
#                    target name: guidance:update:<credential_entry>.
#   channel          "stable" (default) or "beta"; see above.
#   install_dir      required in this form (only the flat form defaults it).
#                    Must be unique and must not equal another target's
#                    rollback directory ("<install_dir>.backup").
#   service_name     optional; see flat form.
#   asset_pattern    optional; see flat form.

# --- Flat form (single product) --------------------------------------------

# GitHub owner/repository containing Guidance Runtime releases.
repository = "paschbaer/guidance-runtime"
channel = "stable"
install_dir = "C:/Program Files/Guidance Runtime"
service_name = "GuidanceRuntime"

# --- Multi-target form (delete the flat keys above to use it) --------------
#
# Each target names where its releases live, whether that source is public or
# private, and where it is installed. install_dir is required in this form;
# only the legacy flat form keeps its historical default. Two targets must not
# share an install_dir, because installing one would overwrite the other; a
# target's install_dir must also not be another target's rollback directory.
#
# For a target named "guidance-runtime", an omitted service_name still means
# the historical service "GuidanceRuntime". For any other target, omitting
# service_name means the target has no service and its archive is installed
# without service control.
#
# [[targets]]
# name = "guidance-runtime"
# repository = "paschbaer/guidance-runtime"
# visibility = "public"
# channel = "stable"
# install_dir = "C:/Program Files/Guidance Runtime"
# service_name = "GuidanceRuntime"
#
# [[targets]]
# name = "guidance"
# repository = "paschbaer/guidance-dist"
# visibility = "private"
# # The NAME of the credential store entry, never the secret itself. The secret
# # is read from the operating system's protected per-user store. Provision the
# # token with read access to this repository's release artifacts only: never
# # source-repository access and never write access.
# credential_entry = "guidance-update"
# channel = "stable"
# install_dir = "C:/Program Files/Guidance"

# Optional, per target. The asset suffix the updater looks for.
# Omit this key to derive it from the platform and architecture the binary runs
# on (windows-x64.zip, windows-arm64.zip, macos-x86_64.zip, macos-aarch64.zip,
# linux-x86_64.zip, linux-aarch64.zip).
# Set it only to override that choice; an empty value is rejected, and so is a
# value that does not end in .zip.
# asset_pattern = "windows-x64.zip"
