[workspace]
resolver="2"
members=["crates/protocol","crates/runtime","crates/ipc","crates/service","crates/cli","crates/tray","crates/update","crates/updater"]
[workspace.package]
version="1.1.0"
edition="2021"
license="Apache-2.0"
[workspace.dependencies]
anyhow="1"
clap={version="4",features=["derive"]}
parking_lot="0.12"
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["full"]}
toml="0.8"
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter","json"]}
uuid={version="1",features=["v4"]}
tray-icon="0.19"
winit="0.30"
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
semver={version="1",features=["serde"]}
sha2="0.10"
zip="2"
tempfile="3"
time={version="0.3",features=["formatting","parsing"]}
url="2"
windows-sys={version="0.59",features=["Win32_Foundation","Win32_Security","Win32_Security_Credentials"]}

