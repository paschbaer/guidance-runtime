name: Runtime Release v3

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'config/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_MAJOR: '1'
  VERSION_MINOR: '3'
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="$VERSION_MAJOR.$VERSION_MINOR.$GITHUB_RUN_NUMBER"
            CHANNEL=stable
            PRE=false
          else
            VERSION="$VERSION_MAJOR.$VERSION_MINOR.0-beta.$GITHUB_RUN_NUMBER"
            CHANNEL=beta
            PRE=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: windows-x64
          - target: aarch64-pc-windows-msvc
            arch: windows-arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package Runtime Layout
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          $name = "guidance-runtime-$env:VERSION-${{ matrix.arch }}"
          $root = "dist/$name"
          New-Item -ItemType Directory -Force "$root/bin","$root/config","$root/docs" | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/*.exe" "$root/bin" -ErrorAction SilentlyContinue
          if (Test-Path "config") { Copy-Item "config/*" "$root/config" -Recurse -ErrorAction SilentlyContinue }
          if (Test-Path "docs") { Copy-Item "docs/*" "$root/docs" -Recurse -ErrorAction SilentlyContinue }
          if (Test-Path "README.md") { Copy-Item "README.md" "$root" }
          if (Test-Path "README.de.md") { Copy-Item "README.de.md" "$root" }

          @{
            version = $env:VERSION
            channel = $env:CHANNEL
            target = '${{ matrix.target }}'
            commit = '${{ github.sha }}'
            runNumber = '${{ github.run_number }}'
          } | ConvertTo-Json | Out-File "$root/release.json" -Encoding utf8

          Compress-Archive -Path $root -DestinationPath "dist/$name.zip"
          $hash=(Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File "dist/$name-SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Protect Immutable Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git fetch --tags --force
          git rev-parse "$TAG" >/dev/null 2>&1 && exit 1 || true
          gh release view "$TAG" >/dev/null 2>&1 && exit 1 || true
      - name: Create Tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$GITHUB_SHA" -m "Guidance Runtime $TAG"
          git push origin "refs/tags/$TAG"
      - name: Publish Beta
        if: needs.metadata.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.metadata.outputs.tag }}" dist/* --verify-tag --prerelease --generate-notes --latest=false --title "Guidance Runtime ${{ needs.metadata.outputs.version }} Beta"
      - name: Publish Stable
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.metadata.outputs.tag }}" dist/* --verify-tag --latest --generate-notes --title "Guidance Runtime ${{ needs.metadata.outputs.version }}"
